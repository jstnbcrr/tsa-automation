<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Logger — TSA</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8fafc; color: #2d3748; min-height: 100vh; }
    nav { background: #1a365d; padding: 16px 40px; display: flex; align-items: center; justify-content: space-between; }
    nav .logo { color: #fff; font-size: 18px; font-weight: 700; }
    nav a { color: #a0aec0; font-size: 13px; text-decoration: none; }
    nav a:hover { color: #fff; }
    .container { max-width: 620px; margin: 48px auto; padding: 0 20px; }
    .card { background: #fff; border-radius: 16px; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
    .card-header { background: linear-gradient(135deg, #276749, #48bb78); padding: 32px; }
    .card-header h1 { color: #fff; font-size: 22px; margin-bottom: 6px; }
    .card-header p { color: #c6f6d5; font-size: 14px; }
    .card-body { padding: 32px; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #4a5568; margin-bottom: 6px; }
    input, select, textarea {
      width: 100%; padding: 10px 14px;
      border: 1px solid #e2e8f0; border-radius: 8px;
      font-size: 14px; font-family: inherit;
      color: #2d3748; background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: #48bb78;
      box-shadow: 0 0 0 3px rgba(72,187,120,0.15);
      background: #fff;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    button {
      width: 100%; padding: 14px;
      background: #276749; color: #fff;
      border: none; border-radius: 8px;
      font-size: 15px; font-weight: 600;
      cursor: pointer; transition: background 0.2s;
      margin-top: 8px;
    }
    button:hover { background: #48bb78; }
    button:disabled { background: #a0aec0; cursor: not-allowed; }
    .success { display: none; background: #f0fff4; border: 1px solid #9ae6b4; border-radius: 8px; padding: 20px; text-align: center; margin-top: 20px; }
    .success h3 { color: #276749; margin-bottom: 6px; }
    .success p { color: #4a5568; font-size: 13px; }
    .error { display: none; background: #fff5f5; border: 1px solid #feb2b2; border-radius: 8px; padding: 16px; margin-top: 16px; font-size: 13px; color: #c53030; }
  </style>
</head>
<body>
<nav>
  <div class="logo">Tech Stack Automation</div>
  <a href="../index.html">← Back to Home</a>
</nav>

<div class="container">
  <div class="card">
    <div class="card-header">
      <h1>💸 Log an Expense</h1>
      <p>Submit any expense — logged to Google Sheets instantly with a receipt emailed to you</p>
    </div>
    <div class="card-body">
      <form id="expenseForm">
        <div class="row">
          <div class="form-group">
            <label>Your Name *</label>
            <input type="text" id="submittedBy" required placeholder="Justin Becerra" />
          </div>
          <div class="form-group">
            <label>Your Email *</label>
            <input type="email" id="email" required placeholder="you@company.com" />
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Category *</label>
            <select id="category" required>
              <option value="">Select category...</option>
              <option>Travel</option>
              <option>Meals & Entertainment</option>
              <option>Software & Subscriptions</option>
              <option>Office Supplies</option>
              <option>Marketing</option>
              <option>Professional Services</option>
              <option>Equipment</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Amount ($) *</label>
            <input type="number" id="amount" required placeholder="0.00" step="0.01" min="0" />
          </div>
        </div>
        <div class="row">
          <div class="form-group">
            <label>Vendor / Merchant *</label>
            <input type="text" id="vendor" required placeholder="Amazon, Delta, etc." />
          </div>
          <div class="form-group">
            <label>Expense Date *</label>
            <input type="date" id="expenseDate" required />
          </div>
        </div>
        <div class="form-group">
          <label>Description *</label>
          <input type="text" id="description" required placeholder="What was this expense for?" />
        </div>
        <button type="submit" id="submitBtn">Log Expense →</button>
      </form>

      <div class="success" id="successMsg">
        <h3>✅ Expense Logged!</h3>
        <p>Your expense has been recorded in Google Sheets. A receipt has been emailed to you.</p>
      </div>
      <div class="error" id="errorMsg">Something went wrong. Please try again.</div>
    </div>
  </div>
</div>

<script>
  // Set today's date as default
  document.getElementById('expenseDate').valueAsDate = new Date();

  document.getElementById('expenseForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Logging...';

    const payload = {
      submittedBy: document.getElementById('submittedBy').value,
      email: document.getElementById('email').value,
      category: document.getElementById('category').value,
      amount: document.getElementById('amount').value,
      vendor: document.getElementById('vendor').value,
      expenseDate: document.getElementById('expenseDate').value,
      description: document.getElementById('description').value
    };

    try {
      await fetch('https://jstnbcrr.app.n8n.cloud/webhook/log-expense', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      document.getElementById('expenseForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
    } catch (err) {
      document.getElementById('errorMsg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Log Expense →';
    }
  });
</script>
</body>
</html>
